spring:
  application:
    name: vms
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:vms}
    username: ${POSTGRES_USER:vms}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-to-a-32-byte-value-1234567890}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@vms.local}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
  visit:
    default-minutes: ${VISIT_DEFAULT_MINUTES:120}
  gate:
    min-stay-seconds: ${GATE_MIN_STAY_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus